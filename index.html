<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlightDeck</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14181D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FlightDeck">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --bg:#14181D;
    --panel:#1C2128;
    --panel-alt:#20262E;
    --line:#2A3038;
    --text:#E8EAED;
    --muted:#8B93A1;
    --amber:#FFB020;
    --amber-dim:rgba(255,176,32,0.14);
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #1a2029 0%, var(--bg) 60%);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    padding:14px;
    -webkit-font-smoothing:antialiased;
  }
  .shell{
    max-width:520px;
    margin:0 auto;
  }

  /* ---- bracket panel ---- */
  .panel{
    position:relative;
    background:var(--panel);
    border:1px solid var(--line);
    padding:16px;
    margin-bottom:12px;
  }
  .panel::before,.panel::after,
  .bracket-tl,.bracket-br{
    content:"";
    position:absolute;
    width:10px;height:10px;
    border:2px solid var(--amber);
    opacity:0.55;
  }
  .panel::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
  .panel::after{ bottom:-1px; right:-1px; border-left:none; border-top:none; }

  /* ---- clock module ---- */
  .clock-module{
    display:flex;
    align-items:center;
    gap:16px;
    padding:18px 16px;
  }
  .analog-wrap{ flex:0 0 auto; }
  .digital-wrap{ flex:1 1 auto; min-width:0; }

  /* ---- world clock ---- */
  .worldclock-row{
    display:flex;
    justify-content:space-between;
    gap:6px;
  }
  .wc-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    flex:1;
  }
  .wc-label{
    font-family:var(--mono);
    font-size:11px;
    color:var(--amber);
    letter-spacing:0.08em;
    margin-top:2px;
  }
  .wc-time{ font-family:var(--mono); font-size:14px; font-variant-numeric:tabular-nums; }
  .wc-offset{ font-family:var(--mono); font-size:10px; color:var(--muted); }
  .digital-time{
    font-family:var(--mono);
    font-size:34px;
    letter-spacing:1px;
    line-height:1;
    color:var(--text);
    font-variant-numeric:tabular-nums;
  }
  .digital-time span.ampm{
    font-size:15px;
    color:var(--amber);
    margin-left:6px;
  }
  .digital-date{
    margin-top:8px;
    font-family:var(--mono);
    font-size:12.5px;
    color:var(--muted);
    letter-spacing:0.06em;
  }
  .digital-date b{ color:var(--text); font-weight:600; }

  /* ---- tabs (panel switches) ---- */
  .switchbar{
    display:flex;
    border:1px solid var(--line);
    margin-bottom:12px;
    overflow-x:auto;
  }
  .switch{
    flex:1 1 0;
    padding:11px 6px;
    background:var(--panel);
    color:var(--muted);
    border:none;
    border-right:1px solid var(--line);
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    cursor:pointer;
    white-space:nowrap;
  }
  .switch:last-child{ border-right:none; }
  .switch.active{
    color:var(--bg);
    background:var(--amber);
  }

  h2.section-title{
    font-size:13px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--muted);
    margin:0 0 12px 0;
    font-family:var(--mono);
  }

  /* ---- calendar ---- */
  .cal-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .cal-nav .month-label{ font-size:16px; font-weight:600; }
  .cal-nav button{
    background:none;
    border:1px solid var(--line);
    color:var(--text);
    width:30px;height:30px;
    cursor:pointer;
    font-size:15px;
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:3px;
  }
  .cal-dow{
    text-align:center;
    font-size:10.5px;
    color:var(--muted);
    font-family:var(--mono);
    padding-bottom:4px;
  }
  .cal-day{
    position:relative;
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-family:var(--mono);
    background:var(--panel-alt);
    color:var(--text);
    cursor:pointer;
    border:1px solid transparent;
  }
  .cal-day.empty{ background:none; cursor:default; }
  .cal-day.today{ border-color:var(--amber); color:var(--amber); font-weight:700; }
  .cal-day .dot{
    position:absolute;
    bottom:3px;
    width:4px;height:4px;
    background:var(--amber);
  }
  .cal-day.open{
    background:var(--amber-dim);
  }
  .day-detail{
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--line);
  }
  .day-detail-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .day-detail-head .month-label{ font-size:14px; }
  .day-jump{
    background:none;
    border:none;
    color:var(--amber);
    font-family:var(--mono);
    font-size:11.5px;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }

  /* ---- lists (alarms/reminders) ---- */
  .item-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .item-row:last-child{ border-bottom:none; }
  .item-time{
    font-family:var(--mono);
    font-size:15px;
    color:var(--amber);
    min-width:64px;
  }
  .item-main{ flex:1; min-width:0; }
  .item-label{ font-size:14px; }
  .item-sub{ font-size:11.5px; color:var(--muted); margin-top:2px; font-family:var(--mono); }
  .item-label.done{ color:var(--muted); text-decoration:line-through; }

  .toggle{
    width:34px;height:19px;
    background:var(--line);
    border:none;
    position:relative;
    cursor:pointer;
    flex:0 0 auto;
  }
  .toggle.on{ background:var(--amber-dim); }
  .toggle::after{
    content:"";
    position:absolute;
    top:2px;left:2px;
    width:15px;height:15px;
    background:var(--muted);
  }
  .toggle.on::after{ background:var(--amber); left:17px; }

  .icon-btn{
    background:none;
    border:none;
    color:var(--muted);
    font-size:16px;
    cursor:pointer;
    padding:2px 6px;
    flex:0 0 auto;
  }
  .icon-btn:hover{ color:var(--amber); }
  .check{
    width:18px;height:18px;
    border:1px solid var(--line);
    background:none;
    cursor:pointer;
    flex:0 0 auto;
    color:var(--amber);
    font-size:12px;
    line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  .check.on{ border-color:var(--amber); background:var(--amber-dim); }

  .empty-state{
    color:var(--muted);
    font-size:13px;
    font-style:normal;
    padding:8px 0 4px 0;
  }

  /* ---- add forms ---- */
  .add-form{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--line);
  }
  .add-form input[type=text]{
    flex:1 1 140px;
  }
  input[type=text],input[type=time],input[type=date],input[type=search],select{
    background:var(--panel-alt);
    border:1px solid var(--line);
    color:var(--text);
    padding:9px 10px;
    font-family:var(--sans);
    font-size:13.5px;
    min-width:0;
  }
  input[type=time],input[type=date]{ font-family:var(--mono); flex:0 0 auto; }
  select{ font-family:var(--sans); }
  .daypick{ display:flex; gap:4px; width:100%; }
  .daypick button{
    flex:1;
    background:var(--panel-alt);
    border:1px solid var(--line);
    color:var(--muted);
    font-family:var(--mono);
    font-size:10.5px;
    padding:6px 0;
    cursor:pointer;
  }
  .daypick button.on{ color:var(--amber); border-color:var(--amber); background:var(--amber-dim); }
  .btn-add{
    width:100%;
    background:var(--amber);
    color:var(--bg);
    border:none;
    padding:10px;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    letter-spacing:0.02em;
  }
  .btn-add:active{ opacity:0.85; }

  /* ---- weather ---- */
  .wx-search{ display:flex; gap:8px; margin-bottom:14px; }
  .wx-search input{ flex:1; }
  .wx-search button{
    background:var(--panel-alt);
    border:1px solid var(--line);
    color:var(--amber);
    padding:0 14px;
    cursor:pointer;
    font-family:var(--mono);
  }
  .wx-main{ display:flex; align-items:center; gap:16px; }
  .wx-temp{
    font-family:var(--mono);
    font-size:44px;
    line-height:1;
  }
  .wx-loc{ font-size:14px; font-weight:600; margin-bottom:4px; }
  .wx-cond{ font-size:12.5px; color:var(--muted); }
  .wx-code{
    font-family:var(--mono);
    font-size:11px;
    color:var(--amber);
    border:1px solid var(--line);
    padding:2px 6px;
    margin-left:6px;
  }
  .wx-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:16px;
    padding-top:14px;
    border-top:1px solid var(--line);
  }
  .wx-stat-label{ font-size:10px; color:var(--muted); font-family:var(--mono); letter-spacing:0.06em; }
  .wx-stat-val{ font-size:16px; font-family:var(--mono); margin-top:3px; }
  .wx-msg{ color:var(--muted); font-size:13px; line-height:1.5; }
  .forecast-label{
    font-size:10px; font-family:var(--mono); color:var(--muted);
    letter-spacing:0.08em; margin-bottom:8px;
  }
  .wx-forecast-hourly{
    display:flex;
    gap:16px;
    overflow-x:auto;
    padding:4px 0 12px 0;
    margin-top:16px;
    padding-top:14px;
    border-top:1px solid var(--line);
  }
  .wx-hour{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    font-family:var(--mono);
    font-size:11px;
    color:var(--muted);
    min-width:40px;
  }
  .wx-hour-temp{ color:var(--text); font-size:13px; }
  .wx-forecast-daily{
    margin-top:4px;
    padding-top:12px;
    border-top:1px solid var(--line);
  }
  .wx-day-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 0;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .wx-day-row:last-child{ border-bottom:none; }
  .wx-day-label{ font-family:var(--mono); width:36px; flex:0 0 auto; color:var(--muted); }
  .wx-day-cond{ flex:1; color:var(--muted); font-size:12px; }
  .wx-day-temps{ font-family:var(--mono); flex:0 0 auto; }
  .wx-day-hi{ color:var(--text); }
  .wx-day-lo{ color:var(--muted); margin-left:5px; }

  /* ---- compass ---- */
  .compass-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:8px 0 4px 0;
  }
  .compass-heading{
    font-family:var(--mono);
    font-size:32px;
    margin-top:14px;
    font-variant-numeric:tabular-nums;
  }
  .compass-cardinal{
    font-family:var(--mono);
    font-size:13px;
    color:var(--amber);
    letter-spacing:0.1em;
    margin-top:2px;
  }

  /* ---- alarm flash ---- */
  #alarmFlash{
    position:fixed;
    top:14px; left:14px; right:14px;
    max-width:520px;
    margin:0 auto;
    background:var(--amber);
    color:var(--bg);
    padding:14px 16px;
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    z-index:50;
    font-family:var(--mono);
    font-weight:600;
    font-size:13.5px;
  }
  #alarmFlash button{
    background:var(--bg);
    color:var(--amber);
    border:none;
    padding:8px 12px;
    cursor:pointer;
    font-family:var(--mono);
    font-weight:700;
  }

  ::placeholder{ color:var(--muted); opacity:0.7; }
  a{color:var(--amber);}

  @media (max-width:360px){
    .digital-time{ font-size:27px; }
    .clock-module{ gap:10px; }
  }
</style>
</head>
<body>

<div id="alarmFlash">
  <span id="alarmFlashText">ALARM</span>
  <button id="alarmFlashDismiss">DISMISS</button>
</div>

<div class="shell">

  <div class="panel clock-module">
    <div class="analog-wrap">
      <svg id="analogClock" width="104" height="104" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="96" fill="none" stroke="#2A3038" stroke-width="2"/>
        <g id="ticks"></g>
        <line id="hourHand" x1="100" y1="100" x2="100" y2="58" stroke="#E8EAED" stroke-width="6" stroke-linecap="square"/>
        <line id="minHand" x1="100" y1="100" x2="100" y2="34" stroke="#E8EAED" stroke-width="4" stroke-linecap="square"/>
        <line id="secHand" x1="100" y1="112" x2="100" y2="26" stroke="#FFB020" stroke-width="2" stroke-linecap="square"/>
        <circle cx="100" cy="100" r="5" fill="#FFB020"/>
      </svg>
    </div>
    <div class="digital-wrap">
      <div class="digital-time"><span id="digitalTime">--:--:--</span><span class="ampm" id="digitalAmPm"></span></div>
      <div class="digital-date" id="digitalDate">—</div>
    </div>
  </div>

  <div class="panel">
    <h2 class="section-title">World Clock</h2>
    <div class="worldclock-row">
      <div class="wc-item">
        <svg viewBox="0 0 200 200" width="60" height="60">
          <circle cx="100" cy="100" r="96" fill="none" stroke="#2A3038" stroke-width="4"/>
          <line id="wcHourIST" x1="100" y1="100" x2="100" y2="58" stroke="#E8EAED" stroke-width="9" stroke-linecap="round"/>
          <line id="wcMinIST" x1="100" y1="100" x2="100" y2="34" stroke="#E8EAED" stroke-width="6" stroke-linecap="round"/>
          <circle cx="100" cy="100" r="7" fill="#FFB020"/>
        </svg>
        <div class="wc-label">IST</div>
        <div class="wc-time" id="wcTimeIST">--:--</div>
        <div class="wc-offset" id="wcOffsetIST">—</div>
      </div>
      <div class="wc-item">
        <svg viewBox="0 0 200 200" width="60" height="60">
          <circle cx="100" cy="100" r="96" fill="none" stroke="#2A3038" stroke-width="4"/>
          <line id="wcHourUTC" x1="100" y1="100" x2="100" y2="58" stroke="#E8EAED" stroke-width="9" stroke-linecap="round"/>
          <line id="wcMinUTC" x1="100" y1="100" x2="100" y2="34" stroke="#E8EAED" stroke-width="6" stroke-linecap="round"/>
          <circle cx="100" cy="100" r="7" fill="#FFB020"/>
        </svg>
        <div class="wc-label">UTC</div>
        <div class="wc-time" id="wcTimeUTC">--:--</div>
        <div class="wc-offset" id="wcOffsetUTC">—</div>
      </div>
      <div class="wc-item">
        <svg viewBox="0 0 200 200" width="60" height="60">
          <circle cx="100" cy="100" r="96" fill="none" stroke="#2A3038" stroke-width="4"/>
          <line id="wcHourJPN" x1="100" y1="100" x2="100" y2="58" stroke="#E8EAED" stroke-width="9" stroke-linecap="round"/>
          <line id="wcMinJPN" x1="100" y1="100" x2="100" y2="34" stroke="#E8EAED" stroke-width="6" stroke-linecap="round"/>
          <circle cx="100" cy="100" r="7" fill="#FFB020"/>
        </svg>
        <div class="wc-label">JAPAN</div>
        <div class="wc-time" id="wcTimeJPN">--:--</div>
        <div class="wc-offset" id="wcOffsetJPN">—</div>
      </div>
    </div>
  </div>

  <div class="switchbar">
    <button class="switch active" data-tab="cal">Calendar</button>
    <button class="switch" data-tab="alarm">Alarms</button>
    <button class="switch" data-tab="remind">Reminders</button>
    <button class="switch" data-tab="wx">Weather</button>
    <button class="switch" data-tab="compass">Compass</button>
  </div>

  <!-- CALENDAR -->
  <div class="panel tab-pane" id="pane-cal">
    <div class="cal-nav">
      <button id="calPrev">‹</button>
      <div class="month-label" id="calMonthLabel">—</div>
      <button id="calNext">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div id="dayDetail" class="day-detail" style="display:none;"></div>
  </div>

  <!-- ALARMS -->
  <div class="panel tab-pane" id="pane-alarm" style="display:none;">
    <h2 class="section-title">Alarms</h2>
    <div id="alarmList"></div>
    <div class="add-form" id="alarmForm">
      <input type="time" id="alarmTimeInput">
      <input type="text" id="alarmLabelInput" placeholder="Label (optional)">
      <div class="daypick" id="alarmDaypick"></div>
      <select id="alarmSoundInput" style="flex:1 1 100%;">
        <option value="beep">Sound: Classic Beep</option>
        <option value="siren">Sound: Siren</option>
        <option value="chime">Sound: Chime</option>
        <option value="pulse">Sound: Urgent Pulse</option>
      </select>
      <button class="btn-add" id="alarmAddBtn">Add alarm</button>
    </div>
  </div>

  <!-- REMINDERS -->
  <div class="panel tab-pane" id="pane-remind" style="display:none;">
    <h2 class="section-title">Reminders</h2>
    <div id="reminderList"></div>
    <div class="add-form" id="reminderForm">
      <input type="text" id="reminderTextInput" placeholder="What's the reminder?">
      <input type="date" id="reminderDateInput">
      <input type="time" id="reminderTimeInput">
      <button class="btn-add" id="reminderAddBtn">Add reminder</button>
    </div>
  </div>

  <!-- WEATHER -->
  <div class="panel tab-pane" id="pane-wx" style="display:none;">
    <h2 class="section-title">Weather</h2>
    <div class="wx-search">
      <input type="search" id="wxCityInput" placeholder="Search a city…">
      <button id="wxSearchBtn">Go</button>
    </div>
    <div id="wxResult"><div class="wx-msg">Search a city to load current conditions.</div></div>
  </div>

  <!-- COMPASS -->
  <div class="panel tab-pane" id="pane-compass" style="display:none;">
    <h2 class="section-title">Compass</h2>
    <div id="compassBody">
      <div class="wx-msg">Uses your device's motion sensor to show true heading. Works when this page is opened in a real mobile browser (not the in-chat preview).</div>
      <button class="btn-add" id="compassEnableBtn" style="margin-top:12px;">Enable compass</button>
    </div>
  </div>

</div>

<script>
(function(){

  /* ================= SHARED STATE (declared first so the clock's
     immediate first tick can safely reference them) ================= */
  let alarms = [];
  let reminders = [];
  let events = [];
  let calViewYear, calViewMonth;
  let openDetailDate = null;

  /* ================= CLOCK ================= */
  const ticksG = document.getElementById('ticks');
  for(let i=0;i<12;i++){
    const angle = i*30;
    const isMajor = i%3===0;
    const r1 = isMajor?80:86, r2=96;
    const rad = (angle-90)*Math.PI/180;
    const x1 = 100+r1*Math.cos(rad), y1=100+r1*Math.sin(rad);
    const x2 = 100+r2*Math.cos(rad), y2=100+r2*Math.sin(rad);
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',x1);line.setAttribute('y1',y1);
    line.setAttribute('x2',x2);line.setAttribute('y2',y2);
    line.setAttribute('stroke', isMajor? '#FFB020':'#2A3038');
    line.setAttribute('stroke-width', isMajor? 3:2);
    ticksG.appendChild(line);
  }
  const hourHand=document.getElementById('hourHand');
  const minHand=document.getElementById('minHand');
  const secHand=document.getElementById('secHand');
  const digitalTime=document.getElementById('digitalTime');
  const digitalAmPm=document.getElementById('digitalAmPm');
  const digitalDate=document.getElementById('digitalDate');
  const DOW=['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

  function pad(n){ return n<10? '0'+n : ''+n; }

  /* ---- world clock (IST / UTC / Japan) ---- */
  const WORLD_ZONES = [
    { id:'IST', tz:'Asia/Kolkata' },
    { id:'UTC', tz:'UTC' },
    { id:'JPN', tz:'Asia/Tokyo' }
  ];
  function tzParts(tz){
    const fmt = new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour:'2-digit', minute:'2-digit', hour12:false });
    const o={};
    fmt.formatToParts(new Date()).forEach(p=>{ o[p.type]=p.value; });
    let hh = parseInt(o.hour,10); if(isNaN(hh) || hh===24) hh=0;
    return { hour: hh, minute: parseInt(o.minute,10)||0 };
  }
  function tzOffsetMinutes(tz){
    const now = new Date();
    const utc = new Date(now.toLocaleString('en-US', { timeZone:'UTC' }));
    const zoned = new Date(now.toLocaleString('en-US', { timeZone:tz }));
    return Math.round((zoned-utc)/60000);
  }
  function formatRelOffset(mins){
    const h = mins/60;
    const sign = h>=0 ? '+' : '-';
    const abs = Math.abs(h);
    const str = (Math.abs(abs % 1) < 0.01) ? abs.toFixed(0) : abs.toFixed(1);
    return sign+str+' hr';
  }
  function updateWorldClocks(){
    const localOffset = -new Date().getTimezoneOffset();
    WORLD_ZONES.forEach(z=>{
      const p = tzParts(z.tz);
      const hAngle = ((p.hour%12)+p.minute/60)*30;
      const mAngle = p.minute*6;
      const hourEl = document.getElementById('wcHour'+z.id);
      const minEl = document.getElementById('wcMin'+z.id);
      if(hourEl) hourEl.setAttribute('transform','rotate('+hAngle+' 100 100)');
      if(minEl) minEl.setAttribute('transform','rotate('+mAngle+' 100 100)');
      const h12 = p.hour%12===0?12:p.hour%12;
      const ampm = p.hour<12?'AM':'PM';
      const timeEl = document.getElementById('wcTime'+z.id);
      if(timeEl) timeEl.textContent = pad(h12)+':'+pad(p.minute)+' '+ampm;
      const offEl = document.getElementById('wcOffset'+z.id);
      if(offEl) offEl.textContent = formatRelOffset(tzOffsetMinutes(z.tz)-localOffset);
    });
  }

  function tickClock(){
    const now = new Date();
    const h=now.getHours(), m=now.getMinutes(), s=now.getSeconds();
    const hAngle = ((h%12)+m/60)*30;
    const mAngle = (m+s/60)*6;
    const sAngle = s*6;
    hourHand.setAttribute('transform', 'rotate('+hAngle+' 100 100)');
    minHand.setAttribute('transform', 'rotate('+mAngle+' 100 100)');
    secHand.setAttribute('transform', 'rotate('+sAngle+' 100 100)');

    const h12 = h%12===0?12:h%12;
    digitalTime.textContent = pad(h12)+':'+pad(m)+':'+pad(s);
    digitalAmPm.textContent = h<12? 'AM':'PM';

    const offMin = -now.getTimezoneOffset();
    const sign = offMin>=0?'+':'-';
    const offH = Math.floor(Math.abs(offMin)/60);
    const offM = Math.abs(offMin)%60;
    const offStr = 'UTC'+sign+offH+(offM? ':'+pad(offM):'');
    digitalDate.innerHTML = '<b>'+DOW[now.getDay()]+'</b> '+now.getDate()+' '+MON[now.getMonth()]+' '+now.getFullYear()+' · '+offStr;

    checkAlarms(now);
    updateWorldClocks();
  }
  tickClock();
  setInterval(tickClock,1000);

  async function loadKey(key, fallback){
    try{
      const r = await window.storage.get(key,false);
      return r? JSON.parse(r.value) : fallback;
    }catch(e){ return fallback; }
  }
  async function saveKey(key, value){
    try{ await window.storage.set(key, JSON.stringify(value), false); }
    catch(e){ console.error('storage save failed', key, e); }
  }

  /* ================= CALENDAR ================= */
  function eventAppliesToDate(ev, dateStr){
    if(ev.repeatYearly) return ev.date.slice(5)===dateStr.slice(5);
    return ev.date===dateStr;
  }

  function renderCalendar(){
    const label = document.getElementById('calMonthLabel');
    label.textContent = MON[calViewMonth]+' '+calViewYear;
    const grid = document.getElementById('calGrid');
    grid.innerHTML='';
    ['S','M','T','W','T','F','S'].forEach(d=>{
      const el=document.createElement('div');
      el.className='cal-dow'; el.textContent=d;
      grid.appendChild(el);
    });
    const firstDow = new Date(calViewYear, calViewMonth, 1).getDay();
    const daysInMonth = new Date(calViewYear, calViewMonth+1, 0).getDate();
    const today = new Date();
    const remindDates = new Set(reminders.filter(r=>r.date).map(r=>r.date));

    for(let i=0;i<firstDow;i++){
      const el=document.createElement('div');
      el.className='cal-day empty';
      grid.appendChild(el);
    }
    for(let d=1; d<=daysInMonth; d++){
      const el=document.createElement('div');
      el.className='cal-day';
      const dateStr = calViewYear+'-'+pad(calViewMonth+1)+'-'+pad(d);
      const isToday = today.getFullYear()===calViewYear && today.getMonth()===calViewMonth && today.getDate()===d;
      if(isToday) el.classList.add('today');
      if(dateStr===openDetailDate) el.classList.add('open');
      el.textContent = d;
      const hasMark = remindDates.has(dateStr) || events.some(e=>eventAppliesToDate(e,dateStr));
      if(hasMark){
        const dot=document.createElement('div');
        dot.className='dot';
        el.appendChild(dot);
      }
      el.addEventListener('click', ()=> toggleDayDetail(dateStr));
      grid.appendChild(el);
    }
  }
  document.getElementById('calPrev').addEventListener('click', ()=>{
    calViewMonth--; if(calViewMonth<0){calViewMonth=11;calViewYear--;}
    renderCalendar();
  });
  document.getElementById('calNext').addEventListener('click', ()=>{
    calViewMonth++; if(calViewMonth>11){calViewMonth=0;calViewYear++;}
    renderCalendar();
  });

    const [y,m,d] = dateStr.split('-').map(Number);
    const dt = new Date(y, m-1, d);

      '<label class="item-sub" style="display:flex;align-items:center;gap:6px;width:100%;">'+

  let audioCtx=null;
  let alarmBeepInterval=null;
  let alarmRepeatTimer=null;
  let alarmRingCount=0;

  function playTone(freq, start, dur, type, vol){
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type||'square'; o.frequency.value=freq;
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(vol||0.15, start);
    g.gain.exponentialRampToValueAtTime(0.001, start+dur);
    o.start(start); o.stop(start+dur+0.02);
  }
  function beep(sound){
    try{
      audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
      const t0 = audioCtx.currentTime;
      if(sound==='siren'){
        const o=audioCtx.createOscillator(), g=audioCtx.createGain();
        o.type='sawtooth';
        o.connect(g); g.connect(audioCtx.destination);
        g.gain.setValueAtTime(0.12, t0);
        o.frequency.setValueAtTime(500, t0);
        o.frequency.linearRampToValueAtTime(1000, t0+0.5);
        o.frequency.linearRampToValueAtTime(500, t0+1.0);
        g.gain.exponentialRampToValueAtTime(0.001, t0+1.1);
        o.start(t0); o.stop(t0+1.15);
      }else if(sound==='chime'){
        playTone(880, t0, 0.5, 'sine', 0.16);
        playTone(1318.5, t0+0.18, 0.6, 'sine', 0.14);
      }else if(sound==='pulse'){
        for(let i=0;i<6;i++) playTone(1200, t0+i*0.16, 0.1, 'square', 0.16);
      }else{
        for(let i=0;i<3;i++) playTone(880, t0+i*0.35, 0.25, 'square', 0.15);
      }
    }catch(e){}
  }
  function checkAlarms(now){
    const hhmm = pad(now.getHours())+':'+pad(now.getMinutes());
    const todayKey = now.toDateString();
    const dow = now.getDay();
    alarms.forEach(a=>{
      if(!a.enabled) return;
      if(a.time!==hhmm) return;
      if(a.days && a.days.length && !a.days.includes(dow)) return;
      if(a.lastTriggered===todayKey+hhmm) return;
      a.lastTriggered = todayKey+hhmm;
      saveKey('flightdeck:alarms', alarms);
      fireAlarm(a);
    });
  }
  function stopAlarmRinging(){
    if(alarmBeepInterval){ clearInterval(alarmBeepInterval); alarmBeepInterval=null; }
    if(alarmRepeatTimer){ clearTimeout(alarmRepeatTimer); alarmRepeatTimer=null; }
  }
  function startRingingPhase(sound){
    beep(sound);
    if(alarmBeepInterval) clearInterval(alarmBeepInterval);
    alarmBeepInterval = setInterval(()=>beep(sound), 2200);
    // ring continuously for 60s, then pause and repeat every 5 min (up to 6 cycles, ~25 min total)
    alarmRepeatTimer = setTimeout(()=>{
      if(alarmBeepInterval){ clearInterval(alarmBeepInterval); alarmBeepInterval=null; }
      alarmRingCount++;
      if(alarmRingCount < 6){
        alarmRepeatTimer = setTimeout(()=>startRingingPhase(sound), 5*60*1000);
      }
    }, 60*1000);
  }
  function fireAlarm(a){
    stopAlarmRinging();
    alarmRingCount = 0;
    startRingingPhase(a.sound||'beep');
    const flash=document.getElementById('alarmFlash');
    document.getElementById('alarmFlashText').textContent = '⏰ '+formatTime12(a.time)+' — '+(a.label||'Alarm');
    flash.style.display='flex';
  }
  document.getElementById('alarmFlashDismiss').addEventListener('click', ()=>{
    document.getElementById('alarmFlash').style.display='none';
    stopAlarmRinging();
  });

  function renderReminders(){
    const list = document.getElementById('reminderList');
    list.innerHTML='';
    if(reminders.length===0){
      list.innerHTML = '<div class="empty-state">No reminders yet.</div>';
      return;
    }
    const todayStr = new Date();
    const todayKey = todayStr.getFullYear()+'-'+pad(todayStr.getMonth()+1)+'-'+pad(todayStr.getDate());
    const sorted = reminders.slice().sort((a,b)=>{
      if(a.done!==b.done) return a.done?1:-1;
      const ak=(a.date||'9999')+(a.time||'99:99');
      const bk=(b.date||'9999')+(b.time||'99:99');
      return ak.localeCompare(bk);
    });
    sorted.forEach(r=>{
      const row=document.createElement('div');
      row.className='item-row';
      const check=document.createElement('button');
      check.className='check'+(r.done?' on':'');
      check.textContent = r.done? '✓':'';
      check.addEventListener('click', ()=>{
        r.done=!r.done; saveKey('flightdeck:reminders', reminders); renderReminders(); renderCalendar();
      });
      const sub=[];
      if(r.date) sub.push(r.date===todayKey? 'Today' : r.date);
      if(r.time) sub.push(formatTime12(r.time));
      const main=document.createElement('div');
      main.className='item-main';
      main.innerHTML = '<div class="item-label'+(r.done?' done':'')+'">'+escapeHtml(r.text)+'</div>'+
        (sub.length? '<div class="item-sub">'+sub.join(' · ')+'</div>':'');
      const del=document.createElement('button');
      del.className='icon-btn'; del.textContent='✕';
      del.addEventListener('click', ()=>{
        reminders = reminders.filter(x=>x.id!==r.id);
        saveKey('flightdeck:reminders', reminders); renderReminders(); renderCalendar();
      });
      row.appendChild(check);
      row.appendChild(main);
      row.appendChild(del);
      list.appendChild(row);
    });
  }

  };
  function wxIconSvg(type){ return WX_ICONS[type] || WX_ICONS.cloud; }
  function hourLabel(isoStr){
    const hh = parseInt(isoStr.slice(11,13),10);
    const h12 = hh%12===0?12:hh%12;
    return h12+(hh<12?'AM':'PM');
  }
  async function runWeatherSearch(city){
    const resultEl = document.getElementById('wxResult');
    resultEl.innerHTML = '<div class="wx-msg">Locating '+escapeHtml(city)+'…</div>';
    try{
      const geoRes = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&name='+encodeURIComponent(city));
      const geo = await geoRes.json();
      if(!geo.results || !geo.results.length){
        resultEl.innerHTML = '<div class="wx-msg">No location found for "'+escapeHtml(city)+'". Try a different spelling.</div>';
        return;
      }
      const loc = geo.results[0];
      await saveKey('flightdeck:weather-city', { name:loc.name, country:loc.country, lat:loc.latitude, lon:loc.longitude });
      await loadAndRenderWeather(loc.name, loc.country, loc.latitude, loc.longitude);
    }catch(e){
      resultEl.innerHTML = "<div class=\"wx-msg\">Signal lost \u2014 could not reach the weather feed. Check your connection and try again.</div>";
    }
  }
  async function loadAndRenderWeather(name,country,lat,lon){
    const resultEl = document.getElementById('wxResult');
    try{
      const wxRes = await fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+
        '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m'+
        '&hourly=temperature_2m,weather_code'+
        '&daily=weather_code,temperature_2m_max,temperature_2m_min'+
        '&timezone=auto');
      const wx = await wxRes.json();
      const c = wx.current;
      const info = WCODE[c.weather_code] || [c.weather_code!==undefined?'Unknown':'','','cloud'];

      let html =
        '<div class="wx-main">'+
          wxIconSvg(info[2])+
          '<div class="wx-temp">'+Math.round(c.temperature_2m)+'°</div>'+
          '<div><div class="wx-loc">'+escapeHtml(name)+(country?', '+escapeHtml(country):'')+'</div>'+
          '<div class="wx-cond">'+info[0]+'<span class="wx-code">'+info[1]+'</span></div></div>'+
        '</div>'+
        '<div class="wx-grid">'+
          '<div><div class="wx-stat-label">FEELS LIKE</div><div class="wx-stat-val">'+Math.round(c.apparent_temperature)+'°</div></div>'+
          '<div><div class="wx-stat-label">HUMIDITY</div><div class="wx-stat-val">'+Math.round(c.relative_humidity_2m)+'%</div></div>'+
          '<div><div class="wx-stat-label">WIND</div><div class="wx-stat-val">'+Math.round(c.wind_speed_10m)+' km/h</div></div>'+
        '</div>';

      // Hourly forecast — next 8 hours from now, in this location's own local time
      if(wx.hourly && wx.hourly.time && c.time){
        const nowKey = c.time.slice(0,13);
        let startIdx = wx.hourly.time.findIndex(t => t.slice(0,13) >= nowKey);
        if(startIdx === -1) startIdx = 0;
        const times = wx.hourly.time.slice(startIdx, startIdx+8);
        const temps = wx.hourly.temperature_2m.slice(startIdx, startIdx+8);
        const codes = wx.hourly.weather_code.slice(startIdx, startIdx+8);
        html += '<div class="wx-forecast-hourly">'+
          times.map((t,i)=>{
            const hi = WCODE[codes[i]] || ['','','cloud'];
            const label = i===0 ? 'Now' : hourLabel(t);
            return '<div class="wx-hour"><div>'+label+'</div>'+wxIconSvg(hi[2])+'<div class="wx-hour-temp">'+Math.round(temps[i])+'°</div></div>';
          }).join('')+
        '</div>';
      }

      // 5-day outlook
      if(wx.daily && wx.daily.time){
        const days = wx.daily.time.slice(0,5);
        const codes = wx.daily.weather_code;
        const maxT = wx.daily.temperature_2m_max;
        const minT = wx.daily.temperature_2m_min;
        html += '<div class="wx-forecast-daily"><div class="forecast-label">5-DAY OUTLOOK</div>'+
          days.map((dstr,i)=>{
            const di = WCODE[codes[i]] || ['','','cloud'];
            const [y,m,d] = dstr.split('-').map(Number);
            const label = i===0 ? 'TDY' : DOW[new Date(y,m-1,d).getDay()];
            return '<div class="wx-day-row"><div class="wx-day-label">'+label+'</div>'+wxIconSvg(di[2])+
              '<div class="wx-day-cond">'+di[0]+'</div>'+
              '<div class="wx-day-temps"><span class="wx-day-hi">'+Math.round(maxT[i])+'°</span><span class="wx-day-lo">'+Math.round(minT[i])+'°</span></div></div>';
          }).join('')+
        '</div>';
      }

      resultEl.innerHTML = html;
    }catch(e){
      resultEl.innerHTML = "<div class=\"wx-msg\">Signal lost \u2014 could not reach the weather feed. Check your connection and try again.</div>";
    }
  }
  document.getElementById('wxSearchBtn').addEventListener('click', ()=>{
    const city = document.getElementById('wxCityInput').value.trim();
    if(city) runWeatherSearch(city);
  });
  document.getElementById('wxCityInput').addEventListener('keydown', (e)=>{
    if(e.key==='Enter'){ const city=e.target.value.trim(); if(city) runWeatherSearch(city); }
  });

  /* ================= COMPASS ================= */
  function cardinalFromHeading(h){
    const dirs=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
    return dirs[Math.round(h/22.5)%16];
  }
  function initCompassTicks(){
    const g = document.getElementById('compassTicks');
    if(!g) return;
    for(let i=0;i<12;i++){
      const angle = i*30;
      const isMajor = i%3===0;
      const r1 = isMajor?78:84, r2=94;
      const rad=(angle-90)*Math.PI/180;
      const x1=100+r1*Math.cos(rad), y1=100+r1*Math.sin(rad);
      const x2=100+r2*Math.cos(rad), y2=100+r2*Math.sin(rad);
      const line=document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1',x1);line.setAttribute('y1',y1);
      line.setAttribute('x2',x2);line.setAttribute('y2',y2);
      line.setAttribute('stroke', isMajor?'#FFB020':'#2A3038');
      line.setAttribute('stroke-width', isMajor?3:2);
      g.appendChild(line);
    }
  }
  function renderCompassDial(){
    const body = document.getElementById('compassBody');
    body.innerHTML =
      '<div class="compass-wrap">'+
        '<svg id="compassDial" width="180" height="180" viewBox="0 0 200 200">'+
          '<circle cx="100" cy="100" r="94" fill="none" stroke="#2A3038" stroke-width="2"/>'+
          '<g id="compassTicks"></g>'+
          '<g id="compassRose">'+
            '<text x="100" y="34" text-anchor="middle" fill="#FFB020" font-size="20" font-weight="700">N</text>'+
            '<text x="166" y="106" text-anchor="middle" fill="#E8EAED" font-size="15">E</text>'+
            '<text x="100" y="176" text-anchor="middle" fill="#E8EAED" font-size="15">S</text>'+
            '<text x="34" y="106" text-anchor="middle" fill="#E8EAED" font-size="15">W</text>'+
          '</g>'+
          '<polygon points="100,16 93,38 107,38" fill="#FFB020"/>'+
          '<circle cx="100" cy="100" r="4" fill="#FFB020"/>'+
        '</svg>'+
        '<div class="compass-heading" id="compassHeadingVal">--°</div>'+
        '<div class="compass-cardinal" id="compassCardinal">—</div>'+
      '</div>';
    initCompassTicks();
  }
  function handleOrientation(e){
    let heading;
    if (typeof e.webkitCompassHeading === 'number'){ heading = e.webkitCompassHeading; }
    else if (e.alpha !== null && e.alpha !== undefined){ heading = 360 - e.alpha; }
    else { return; }
    heading = ((heading%360)+360)%360;
    const rose = document.getElementById('compassRose');
    if(rose) rose.setAttribute('transform','rotate('+(-heading)+' 100 100)');
    const headingEl = document.getElementById('compassHeadingVal');
    const cardEl = document.getElementById('compassCardinal');
    if(headingEl) headingEl.textContent = Math.round(heading)+'°';
    if(cardEl) cardEl.textContent = cardinalFromHeading(heading);
  }
  function enableCompass(){
    const body = document.getElementById('compassBody');
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
      DeviceOrientationEvent.requestPermission().then(state=>{
        if(state==='granted'){
          renderCompassDial();
          window.addEventListener('deviceorientation', handleOrientation);
        }else{
          body.innerHTML = '<div class="wx-msg">Compass permission denied. Allow motion & orientation access for this page in your browser settings and try again.</div>';
        }
      }).catch(()=>{
        body.innerHTML = '<div class="wx-msg">Could not request compass permission on this browser.</div>';
      });
    }else if ('ondeviceorientationabsolute' in window){
      renderCompassDial();
      window.addEventListener('deviceorientationabsolute', handleOrientation);
    }else if ('ondeviceorientation' in window){
      renderCompassDial();
      window.addEventListener('deviceorientation', handleOrientation);
    }else{
      body.innerHTML = '<div class="wx-msg">This device/browser does not expose a compass sensor.</div>';
    }
  }
  document.getElementById('compassEnableBtn').addEventListener('click', enableCompass);

  /* ================= INIT ================= */
  async function init(){
    const now = new Date();
    calViewYear = now.getFullYear(); calViewMonth = now.getMonth();

    alarms = await loadKey('flightdeck:alarms', []);
    reminders = await loadKey('flightdeck:reminders', []);
    events = await loadKey('flightdeck:events', []);
    renderAlarms();
    renderReminders();
    renderCalendar();

    const savedCity = await loadKey('flightdeck:weather-city', null);
    if(savedCity){
      document.getElementById('wxCityInput').value = savedCity.name;
      loadAndRenderWeather(savedCity.name, savedCity.country, savedCity.lat, savedCity.lon);
    }
  }
  init();

})();
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
